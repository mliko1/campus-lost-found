<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布失物 · 校园失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="deco">
  <div class="d-circle"></div>
  <div class="d-dots"></div>
  <svg class="d-arch" viewBox="0 0 300 200" fill="none" stroke-width="1.2"><path d="M20 180 V70 a55 55 0 0 1 110 0 V180 M130 180 V55 a60 60 0 0 1 120 0 V180"/><line x1="0" y1="180" x2="300" y2="180"/></svg>
</div>

<header class="site"><div class="nav-in">
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-5.1-7-11a7 7 0 0 1 14 0c0 5.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
  <div class="brand">校园失物招领</div>
  <div class="crumb">/ <b>发布失物</b></div>
  <nav class="links">
    <a href="index.html">招领大厅</a><a class="on" href="lost.html">发布失物</a><a href="found.html">发布招领</a><a href="records.html">我的记录</a>
  </nav>
</div></header>

<main class="wrap">
  <div class="kicker" data-n="04">Lost Report</div>
  <h1 class="title">发布失物</h1>
  <p class="sub">填写遗失线索，方便同学帮你寻找。带 <span style="color:var(--amber)">*</span> 的项目为必填项。</p>

  <div class="card" style="margin-top:26px">
    <div class="field"><label>物品名称 <i>*</i></label><input placeholder="黑色耳机盒"></div>
    <div class="field"><label>物品分类 <i>*</i></label>
      <select><option>数码配件</option><option>生活物品</option><option>书籍证件</option><option>钥匙卡类</option><option>其他</option></select>
    </div>
    <div class="field"><label>遗失地点 <i>*</i></label><input placeholder="主校区 · 图书馆二楼"></div>
    <div class="field"><label>遗失时间 <i>*</i></label><input placeholder="11月3日 13:30 左右"></div>
    <div class="field"><label>公开描述</label><input placeholder="黑色磨砂外壳，约掌心大小"></div>
    <div class="field"><label>照片</label><input placeholder="添加照片（可选）"><div class="aside">上传前请遮住学号等个人信息。</div></div>
  </div>

  <div style="margin-top:26px"><button class="btn">发布失物</button></div>
</main>

<footer>
  <svg class="f-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-5.1-7-11a7 7 0 0 1 14 0c0 5.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
  校园失物招领 · 让每一件失物都能回到主人身边
</footer>
</body>
</html>
